<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f6f0"><title>カタカナ ポケット</title><link rel="stylesheet" href="style.css"></head><body><main><header><a href="#" id="home" aria-label="ホーム">カ<span>タ</span>カナ ポケット<span class="tiny">KATAKANA POCKET</span></a><select id="language" aria-label="Language / 言語 / ภาษา"><option value="ja">日本語</option><option value="th">ไทย</option><option value="en">English</option></select></header><section id="menu"><div class="eyebrow">かいて、おぼえる。</div><h1>ひらがなから、<br>カタカナへ<span class="orange">。</span></h1><p class="intro">「あ」を見たら、「ア」を書こう。<br>指を動かして、ひとつずつ自分の文字に。</p><div class="letter-art" aria-hidden="true"><span>あ</span><b>→</b><span>ア<i>✦</i></span></div><form id="name-form"><label for="student-name" data-t="nameLabel"></label><input id="student-name" name="name" autocomplete="name" maxlength="60" required><p class="footnote" data-t="nameNote"></p></form><div class="mode-list"><button class="mode" id="random"><span class="mode-icon">↝</span><span><strong>ランダム 10問</strong><small>どの文字が出るか、おたのしみ。</small></span><b>↗</b></button><button class="mode secondary" id="ordered"><span class="mode-icon">あ</span><span><strong>あいうえお順</strong><small>あ〜ん、46文字をじっくり。</small></span><b>→</b></button></div><p class="footnote">濁音・半濁音・小さい文字は出ません。</p><div class="record"><span>これまでにクリアした文字</span><strong id="total">0 <small>/ 46</small></strong></div></section><section id="game" hidden><div class="game-meta"><button id="back" class="text-btn">← もどる</button><span id="mode-name"></span><b id="counter"></b></div><p class="player-line"><span data-t="playerLabel"></span> <strong id="player-name"></strong></p><div class="progress"><div id="progress-fill"></div></div><div class="prompt"><span>カタカナで かいてみよう</span><h2 id="question">あ</h2></div><div class="paper"><div class="guide horizontal"></div><div class="guide vertical"></div><span id="hint-letter" hidden></span><canvas id="drawing" width="600" height="600" aria-label="指やマウスでカタカナを書く欄"></canvas><span class="paper-label">ここに かいてね</span></div><div class="drawing-tools"><button id="clear">↺ 書きなおす</button><button id="hint" aria-pressed="false">✧ ヒント</button></div><div id="feedback" role="status" aria-live="polite">お手本なしで、チャレンジ！</div><button class="primary" id="check">できた！</button><button class="primary" id="next" hidden>つぎの文字へ →</button><p class="footnote">形の判定は目安です。書き順は判定しません。</p></section><section id="result" hidden><div class="eyebrow">NICE WRITING!</div><div class="finish-icon">✦</div><h1>よくできました<span class="orange">。</span></h1><p id="result-text"></p><div id="result-letters"></div><button id="issue-certificate" class="primary" data-t="issue"></button><button class="primary" id="again">もういちど あそぶ ↗</button><button class="text-btn" id="to-menu">ホームにもどる</button></section><section id="certificate-view" hidden><p class="capture-note" data-t="captureNote"></p><article id="certificate" aria-label="修了証"><div class="cert-sparkles" aria-hidden="true">✦ · ★ · ✧ · ★ · ✦</div><div class="cert-brand">KATAKANA POCKET</div><div class="cert-medal" aria-hidden="true">★</div><div class="cert-kicker" data-t="certKicker"></div><h1 data-t="certTitle"></h1><div id="cert-division"></div><div class="cert-presented" data-t="presented"></div><div id="cert-name"></div><p data-t="certBody"></p><div class="cert-stats"><div><strong id="cert-count"></strong><span data-t="clearedLabel"></span></div><div><strong id="cert-hints"></strong><span data-t="hintsLabel"></span></div></div><div class="cert-date"><span data-t="dateLabel"></span><strong id="cert-date"></strong></div><div class="cert-bottom"><span id="cert-code"></span><b>✦ WELL DONE ✦</b></div></article><div class="cert-actions"><button id="save-certificate" class="primary" data-t="saveImage"></button><p id="save-status" role="status" aria-live="polite"></p><details id="saved-image-panel" hidden><summary data-t="imagePreview"></summary><p class="footnote" data-t="longPress"></p><img id="saved-image" alt=""></details><button id="cert-home" class="text-btn" data-t="home"></button></div></section><footer>ひと文字ずつ、できるがふえる。</footer></main><script src="i18n.js"></script><script src="app.js"></script><script src="certificate.js"></script></body></html>
